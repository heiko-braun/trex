document:
  dsl: 1.0.0
  taskQueue: pod-memory-trend
  workflowType: pod-memory-trend
  version: 0.0.1
  title: Pod Memory Trend Investigation
  summary: >
    Chains two managed agents sequentially, calling each as a Temporal
    activity: Ops Buddy finds a pod's memory trend, then Log Monitoring
    correlates it against OpenSearch logs. Each agent must be registered
    with the workflow server first — see "Running a workflow: startup
    order" in CLAUDE.md — since call: activity routes to whichever agent
    worker is polling that task queue. invoke-agent returns immediately
    (it never blocks on the agent's A2A task finishing); when it comes
    back with a task rather than a direct answer, a poll-agent-task loop
    checks on it every few seconds. Each activity fetches its own fresh
    Bearer token server-side right before its A2A call (see
    internal/agents.AgentctlTokenSource) instead of one being passed in
    as workflow input, so no token needs to outlive any single call. See
    specs/async-agent-dispatch.md.

input:
  schema:
    document:
      type: object
      properties:
        podName:
          type: string
        namespace:
          type: string
      required:
        - podName
        - namespace

do:
  - askOpsBuddy:
      call: activity
      with:
        name: invoke-agent
        taskQueue: agent-common-texture-7097
        arguments:
          - Input: ${ "Find the latest memory trend for pod " + $input.podName + " in namespace " + $input.namespace + ". Report the trend and any notable timestamps (e.g. spikes)." }
      metadata:
        activityOptions:
          startToCloseTimeout:
            seconds: 60
          scheduleToCloseTimeout:
            minutes: 3
      export:
        as:
          opsBuddyDone: ${ $data.askOpsBuddy.Done }
          opsBuddyResult: ${ $data.askOpsBuddy.Result }
          opsBuddyTaskID: ${ $data.askOpsBuddy.TaskID }

  - pollOpsBuddy:
      for:
        each: attempt
        in: ${ 60 }
        at: index
      while: ${ ($context.opsBuddyDone // false) == false and $data.index < 59 }
      do:
        - cooldown:
            wait:
              seconds: 8
        - pollOpsBuddyTask:
            call: activity
            with:
              name: poll-agent-task
              taskQueue: agent-common-texture-7097
              arguments:
                - TaskID: ${ $context.opsBuddyTaskID }
            metadata:
              activityOptions:
                startToCloseTimeout:
                  seconds: 15
            export:
              as:
                opsBuddyTaskID: ${ $context.opsBuddyTaskID }
                opsBuddyDone: ${ $data.pollOpsBuddyTask.Done }
                opsBuddyFailed: ${ $data.pollOpsBuddyTask.Failed }
                opsBuddyResult: ${ $data.pollOpsBuddyTask.Result }

  - askLogMonitoring:
      call: activity
      with:
        name: invoke-agent
        taskQueue: agent-pure-degree-6613
        arguments:
          - Input: "${ \"Search OpenSearch for logs from pod \" + $input.podName + \" in namespace \" + $input.namespace + \" that correlate with this memory trend: \" + $context.opsBuddyResult + \". Report any errors, warnings, or events around that time.\" }"
      metadata:
        activityOptions:
          startToCloseTimeout:
            seconds: 60
          scheduleToCloseTimeout:
            minutes: 3
      export:
        as:
          opsBuddyResult: ${ $context.opsBuddyResult }
          logMonitoringDone: ${ $data.askLogMonitoring.Done }
          logMonitoringResult: ${ $data.askLogMonitoring.Result }
          logMonitoringTaskID: ${ $data.askLogMonitoring.TaskID }

  - pollLogMonitoring:
      for:
        each: attempt
        in: ${ 60 }
        at: index
      while: ${ ($context.logMonitoringDone // false) == false and $data.index < 59 }
      do:
        - cooldown:
            wait:
              seconds: 8
        - pollLogMonitoringTask:
            call: activity
            with:
              name: poll-agent-task
              taskQueue: agent-pure-degree-6613
              arguments:
                - TaskID: ${ $context.logMonitoringTaskID }
            metadata:
              activityOptions:
                startToCloseTimeout:
                  seconds: 15
            export:
              as:
                opsBuddyResult: ${ $context.opsBuddyResult }
                logMonitoringTaskID: ${ $context.logMonitoringTaskID }
                logMonitoringDone: ${ $data.pollLogMonitoringTask.Done }
                logMonitoringFailed: ${ $data.pollLogMonitoringTask.Failed }
                logMonitoringResult: ${ $data.pollLogMonitoringTask.Result }

output:
  as: ${ "Memory trend:\n" + $context.opsBuddyResult + "\n\nCorrelated log findings:\n" + $context.logMonitoringResult }
