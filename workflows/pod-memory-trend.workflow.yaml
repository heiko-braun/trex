document:
  dsl: 1.0.0
  taskQueue: pod-memory-trend
  workflowType: pod-memory-trend
  version: 0.0.3
  title: Pod Memory Trend Investigation
  summary: >
    Chains three managed agents sequentially, calling each as a Temporal
    activity: Ops Buddy finds a pod's memory trend, Log Monitoring
    correlates it against OpenSearch logs, then Editor synthesizes both
    into one clear response. Each agent must be registered
    with the workflow server first — see "Running a workflow: startup
    order" in CLAUDE.md — since call: activity routes to whichever agent
    worker is polling that task queue. invoke-agent returns immediately
    (it never blocks on the agent's A2A task finishing); when it comes
    back with a task rather than a direct answer, a poll-agent-task loop
    checks on it every few seconds. Each activity fetches its own fresh
    Bearer token server-side right before its A2A call (see
    internal/agents.AgentctlTokenSource) instead of one being passed in
    as workflow input, so no token needs to outlive any single call. See
    specs/async-agent-dispatch.md.

    Data passing follows docs/architecure/task-envelope-design.md
    (minimal slice, see specs/task-envelopes-minimal-slice.md): $context
    carries manifest.Ref structs per slot (opsBuddyRef, logMonitoringRef,
    editorRef) rather than raw result strings. Every invoke-agent /
    poll-agent-task call passes `Reads` (a map of slot name -> Ref the
    activity should resolve from the Minio-backed blobstore) and an
    `Instruction` template with `{{slot}}` placeholders — the activity
    itself fetches ref content and substitutes it into the instruction,
    so the workflow only ever moves small refs, never raw agent output.
    On completion each activity uploads its result to blobstore and
    returns a `Revision` (Ref + ProducedBy + Reason), which the workflow
    appends into $context as the new slot ref. Editor's activity also
    returns the same content as plain `Result` text alongside its
    Revision, purely so formatOutput can produce the workflow's final
    text output without a separate ref-resolution step — every other
    consumer reads the ref, not this field.

    As its last step before formatOutput, the workflow calls
    write-envelope-index (see specs/task-envelope-browser.md) once, on
    this workflow's own task queue (pod-memory-trend), passing every
    current slot ref from $context. This call must stay in the root
    workflow's own do: list, never inside a pollX for-loop: Zigflow runs
    each for/while iteration as its own child Temporal workflow (confirmed
    via `temporal workflow list`), and activity.GetInfo(ctx)'s
    WorkflowExecution.ID is whichever workflow directly invoked the
    activity — a call from inside pollEditor would record that child's ID,
    not this workflow's own, breaking the envelope browser's lookup by
    root workflow ID.

    Data flow otherwise follows Zigflow's documented model — see
    docs/zigflow-syntax-reference.md for the full rules; in short: every
    export.as merges via `$context + {...}` rather than replacing it, and
    each `for` loop needs both a nested export.as inside `do:` (feeds
    `while` between iterations) and its OWN export.as on the `for` task
    itself reading `.[-1].<field>` (the only way to surface the loop's
    final result to sibling tasks after it exits). Verified end-to-end
    against real agents on stage.

input:
  schema:
    document:
      type: object
      properties:
        podName:
          type: string
        namespace:
          type: string
      required:
        - podName
        - namespace

do:
  - askOpsBuddy:
      call: activity
      with:
        name: invoke-agent
        taskQueue: agent-common-texture-7097
        arguments:
          - Reads: {}
            Instruction: ${ "Find the latest memory trend for pod " + $input.podName + " in namespace " + $input.namespace + ". Report the trend and any notable timestamps (e.g. spikes)." }
      metadata:
        activityOptions:
          startToCloseTimeout:
            seconds: 60
          scheduleToCloseTimeout:
            minutes: 3
      export:
        as: '${ $context + { opsBuddyDone: .Done, opsBuddyRef: .Revision.Ref, opsBuddyTaskID: .TaskID } }'

  - pollOpsBuddy:
      for:
        each: attempt
        in: ${ 60 }
        at: index
      while: ${ ($context.opsBuddyDone // false) == false and $data.index < 59 }
      export:
        as: '${ $context + { opsBuddyDone: (.[-1].Done // $context.opsBuddyDone), opsBuddyFailed: (.[-1].Failed // false), opsBuddyRef: (.[-1].Revision.Ref // $context.opsBuddyRef) } }'
      do:
        - cooldown:
            wait:
              seconds: 8
        - pollOpsBuddyTask:
            call: activity
            with:
              name: poll-agent-task
              taskQueue: agent-common-texture-7097
              arguments:
                - TaskID: ${ $context.opsBuddyTaskID }
                  ProducedBy: poll-agent-task
                  Reason: initial
            metadata:
              activityOptions:
                startToCloseTimeout:
                  seconds: 15
            export:
              as: '${ $context + { opsBuddyDone: .Done, opsBuddyFailed: .Failed, opsBuddyRef: .Revision.Ref } }'

  - askLogMonitoring:
      call: activity
      with:
        name: invoke-agent
        taskQueue: agent-pure-degree-6613
        arguments:
          - Reads: '${ { opsBuddyResult: $context.opsBuddyRef } }'
            Instruction: '${ "Search OpenSearch for logs from pod " + $input.podName + " in namespace " + $input.namespace + " that correlate with this memory trend: {{opsBuddyResult}}. Report any errors, warnings, or events around that time." }'
      metadata:
        activityOptions:
          startToCloseTimeout:
            seconds: 60
          scheduleToCloseTimeout:
            minutes: 3
      export:
        as: '${ $context + { logMonitoringDone: .Done, logMonitoringRef: .Revision.Ref, logMonitoringTaskID: .TaskID } }'

  - pollLogMonitoring:
      for:
        each: attempt
        in: ${ 60 }
        at: index
      while: ${ ($context.logMonitoringDone // false) == false and $data.index < 59 }
      export:
        as: '${ $context + { logMonitoringDone: (.[-1].Done // $context.logMonitoringDone), logMonitoringFailed: (.[-1].Failed // false), logMonitoringRef: (.[-1].Revision.Ref // $context.logMonitoringRef) } }'
      do:
        - cooldown:
            wait:
              seconds: 8
        - pollLogMonitoringTask:
            call: activity
            with:
              name: poll-agent-task
              taskQueue: agent-pure-degree-6613
              arguments:
                - TaskID: ${ $context.logMonitoringTaskID }
                  ProducedBy: poll-agent-task
                  Reason: initial
            metadata:
              activityOptions:
                startToCloseTimeout:
                  seconds: 15
            export:
              as: '${ $context + { logMonitoringDone: .Done, logMonitoringFailed: .Failed, logMonitoringRef: .Revision.Ref } }'

  - askEditor:
      call: activity
      with:
        name: invoke-agent
        taskQueue: agent-uncovered-bridge-6836
        arguments:
          - Reads: '${ { plan: $context.opsBuddyRef, review: $context.logMonitoringRef } }'
            Instruction: "Refine and summarize the following investigation into a single, clear response.\n\nMemory trend findings:\n{{plan}}\n\nCorrelated log findings:\n{{review}}"
      metadata:
        activityOptions:
          startToCloseTimeout:
            seconds: 60
          scheduleToCloseTimeout:
            minutes: 3
      export:
        as: '${ $context + { editorDone: .Done, editorRef: .Revision.Ref, editorResult: .Result, editorTaskID: .TaskID } }'

  - pollEditor:
      for:
        each: attempt
        in: ${ 60 }
        at: index
      while: ${ ($context.editorDone // false) == false and $data.index < 59 }
      export:
        as: '${ $context + { editorDone: (.[-1].Done // $context.editorDone), editorFailed: (.[-1].Failed // false), editorRef: (.[-1].Revision.Ref // $context.editorRef), editorResult: (.[-1].Result // $context.editorResult) } }'
      do:
        - cooldown:
            wait:
              seconds: 8
        - pollEditorTask:
            call: activity
            with:
              name: poll-agent-task
              taskQueue: agent-uncovered-bridge-6836
              arguments:
                - TaskID: ${ $context.editorTaskID }
                  ProducedBy: poll-agent-task
                  Reason: initial
            metadata:
              activityOptions:
                startToCloseTimeout:
                  seconds: 15
            export:
              as: '${ $context + { editorDone: .Done, editorFailed: .Failed, editorRef: .Revision.Ref, editorResult: .Result } }'

  - writeEnvelopeIndex:
      call: activity
      with:
        name: write-envelope-index
        taskQueue: pod-memory-trend
        arguments:
          - Tenant: platform
            Slots: '${ { opsBuddyRef: $context.opsBuddyRef, logMonitoringRef: $context.logMonitoringRef, editorRef: $context.editorRef } }'
      metadata:
        activityOptions:
          startToCloseTimeout:
            seconds: 15

  - formatOutput:
      output:
        as: ${ $context.editorResult }
      set:
        done: true
