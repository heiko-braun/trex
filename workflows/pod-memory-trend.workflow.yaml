document:
  dsl: 1.0.0
  taskQueue: pod-memory-trend
  workflowType: pod-memory-trend
  version: 0.0.1
  title: Pod Memory Trend Investigation
  summary: >
    Chains three managed agents sequentially, calling each as a Temporal
    activity: Ops Buddy finds a pod's memory trend, Log Monitoring
    correlates it against OpenSearch logs, then Editor synthesizes both
    into one clear response. Each agent must be registered
    with the workflow server first — see "Running a workflow: startup
    order" in CLAUDE.md — since call: activity routes to whichever agent
    worker is polling that task queue. invoke-agent returns immediately
    (it never blocks on the agent's A2A task finishing); when it comes
    back with a task rather than a direct answer, a poll-agent-task loop
    checks on it every few seconds. Each activity fetches its own fresh
    Bearer token server-side right before its A2A call (see
    internal/agents.AgentctlTokenSource) instead of one being passed in
    as workflow input, so no token needs to outlive any single call. See
    specs/async-agent-dispatch.md.
    Data flow follows Zigflow's documented model — see
    docs/zigflow-syntax-reference.md for the full rules; in short: every
    export.as merges via `$context + {...}` rather than replacing it, and
    each `for` loop needs both a nested export.as inside `do:` (feeds
    `while` between iterations) and its OWN export.as on the `for` task
    itself reading `.[-1].<field>` (the only way to surface the loop's
    final result to sibling tasks after it exits). Verified end-to-end
    against real agents on stage.

input:
  schema:
    document:
      type: object
      properties:
        podName:
          type: string
        namespace:
          type: string
      required:
        - podName
        - namespace

do:
  - askOpsBuddy:
      call: activity
      with:
        name: invoke-agent
        taskQueue: agent-common-texture-7097
        arguments:
          - Input: ${ "Find the latest memory trend for pod " + $input.podName + " in namespace " + $input.namespace + ". Report the trend and any notable timestamps (e.g. spikes)." }
      metadata:
        activityOptions:
          startToCloseTimeout:
            seconds: 60
          scheduleToCloseTimeout:
            minutes: 3
      export:
        as: '${ $context + { opsBuddyDone: .Done, opsBuddyResult: .Result, opsBuddyTaskID: .TaskID } }'

  - pollOpsBuddy:
      for:
        each: attempt
        in: ${ 60 }
        at: index
      while: ${ ($context.opsBuddyDone // false) == false and $data.index < 59 }
      export:
        as: '${ $context + { opsBuddyDone: (.[-1].Done // $context.opsBuddyDone), opsBuddyFailed: (.[-1].Failed // false), opsBuddyResult: (.[-1].Result // $context.opsBuddyResult) } }'
      do:
        - cooldown:
            wait:
              seconds: 8
        - pollOpsBuddyTask:
            call: activity
            with:
              name: poll-agent-task
              taskQueue: agent-common-texture-7097
              arguments:
                - TaskID: ${ $context.opsBuddyTaskID }
            metadata:
              activityOptions:
                startToCloseTimeout:
                  seconds: 15
            export:
              as: '${ $context + { opsBuddyDone: .Done, opsBuddyFailed: .Failed, opsBuddyResult: .Result } }'

  - askLogMonitoring:
      call: activity
      with:
        name: invoke-agent
        taskQueue: agent-pure-degree-6613
        arguments:
          - Input: "${ \"Search OpenSearch for logs from pod \" + $input.podName + \" in namespace \" + $input.namespace + \" that correlate with this memory trend: \" + $context.opsBuddyResult + \". Report any errors, warnings, or events around that time.\" }"
      metadata:
        activityOptions:
          startToCloseTimeout:
            seconds: 60
          scheduleToCloseTimeout:
            minutes: 3
      export:
        as: '${ $context + { logMonitoringDone: .Done, logMonitoringResult: .Result, logMonitoringTaskID: .TaskID } }'

  - pollLogMonitoring:
      for:
        each: attempt
        in: ${ 60 }
        at: index
      while: ${ ($context.logMonitoringDone // false) == false and $data.index < 59 }
      export:
        as: '${ $context + { logMonitoringDone: (.[-1].Done // $context.logMonitoringDone), logMonitoringFailed: (.[-1].Failed // false), logMonitoringResult: (.[-1].Result // $context.logMonitoringResult) } }'
      do:
        - cooldown:
            wait:
              seconds: 8
        - pollLogMonitoringTask:
            call: activity
            with:
              name: poll-agent-task
              taskQueue: agent-pure-degree-6613
              arguments:
                - TaskID: ${ $context.logMonitoringTaskID }
            metadata:
              activityOptions:
                startToCloseTimeout:
                  seconds: 15
            export:
              as: '${ $context + { logMonitoringDone: .Done, logMonitoringFailed: .Failed, logMonitoringResult: .Result } }'

  - askEditor:
      call: activity
      with:
        name: invoke-agent
        taskQueue: agent-uncovered-bridge-6836
        arguments:
          - Input: "${ \"Refine and summarize the following investigation into a single, clear response.\\n\\nMemory trend findings:\\n\" + $context.opsBuddyResult + \"\\n\\nCorrelated log findings:\\n\" + $context.logMonitoringResult }"
      metadata:
        activityOptions:
          startToCloseTimeout:
            seconds: 60
          scheduleToCloseTimeout:
            minutes: 3
      export:
        as: '${ $context + { editorDone: .Done, editorResult: .Result, editorTaskID: .TaskID } }'

  - pollEditor:
      for:
        each: attempt
        in: ${ 60 }
        at: index
      while: ${ ($context.editorDone // false) == false and $data.index < 59 }
      export:
        as: '${ $context + { editorDone: (.[-1].Done // $context.editorDone), editorFailed: (.[-1].Failed // false), editorResult: (.[-1].Result // $context.editorResult) } }'
      do:
        - cooldown:
            wait:
              seconds: 8
        - pollEditorTask:
            call: activity
            with:
              name: poll-agent-task
              taskQueue: agent-uncovered-bridge-6836
              arguments:
                - TaskID: ${ $context.editorTaskID }
            metadata:
              activityOptions:
                startToCloseTimeout:
                  seconds: 15
            export:
              as: '${ $context + { editorDone: .Done, editorFailed: .Failed, editorResult: .Result } }'

  - formatOutput:
      output:
        as: ${ $context.editorResult }
      set:
        done: true
